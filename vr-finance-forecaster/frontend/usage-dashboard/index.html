<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VR Finance Forecaster — Usage Dashboard</title>
<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --page-plane: #f9f9f7;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --gridline: #e1e0d9;
    --baseline: #c3c2b7;
    --series-1: #2a78d6;
    --border-ring: rgba(11, 11, 11, 0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --surface-1: #1a1a19;
      --page-plane: #0d0d0d;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --gridline: #2c2c2a;
      --baseline: #383835;
      --series-1: #3987e5;
      --border-ring: rgba(255, 255, 255, 0.10);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page-plane);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 32px 24px 64px;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 8px; }
  h1 { font-size: 20px; margin: 0; }
  #status { font-size: 12px; color: var(--text-muted); }
  #refresh-btn {
    padding: 8px 14px; border-radius: 6px; border: 1px solid var(--border-ring);
    background: var(--surface-1); color: var(--text-primary); font-size: 13px; cursor: pointer;
  }
  .stat-row { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
  .stat-tile {
    flex: 1; min-width: 180px; background: var(--surface-1);
    border: 1px solid var(--border-ring); border-radius: 10px; padding: 16px 20px;
  }
  .stat-tile .label { font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; }
  .stat-tile .value { font-size: 32px; font-weight: 600; }
  .card {
    background: var(--surface-1); border: 1px solid var(--border-ring);
    border-radius: 10px; padding: 20px; margin-bottom: 24px;
  }
  .card-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; flex-wrap: wrap; gap: 8px; }
  .card h2 { font-size: 15px; margin: 0; }
  .card .caption { font-size: 12px; color: var(--text-muted); margin: 0 0 12px; }
  .table-toggle {
    font-size: 12px; color: var(--text-secondary); background: none; border: none;
    text-decoration: underline; cursor: pointer; padding: 0;
  }
  svg text { fill: var(--text-secondary); font-size: 11px; font-family: inherit; }
  .gridline { stroke: var(--gridline); stroke-width: 1; }
  .baseline { stroke: var(--baseline); stroke-width: 1; }
  .bar { fill: var(--series-1); }
  .bar-hit { fill: transparent; cursor: pointer; }
  .bar-hit:hover + .bar, .bar-hit:focus + .bar { fill: var(--series-1); opacity: 0.8; }
  .bar-value { fill: var(--text-primary); font-weight: 600; text-anchor: middle; }
  table.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.data-table th, table.data-table td {
    text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--gridline);
  }
  table.data-table th { color: var(--text-secondary); font-weight: 600; }
  table.data-table td.truncate { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #tooltip {
    position: fixed; pointer-events: none; background: var(--text-primary); color: var(--page-plane);
    font-size: 12px; padding: 6px 9px; border-radius: 6px; display: none; z-index: 100;
    transform: translate(-50%, -120%);
  }
  #tooltip strong { font-weight: 700; }
  .empty-state { color: var(--text-muted); font-size: 13px; padding: 12px 0; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Usage Dashboard</h1>
      <div style="display:flex; align-items:center; gap:12px;">
        <span id="status">Loading...</span>
        <button id="refresh-btn">Refresh</button>
      </div>
    </header>

    <div class="stat-row">
      <div class="stat-tile">
        <div class="label">Total events logged</div>
        <div class="value" id="stat-total">—</div>
      </div>
      <div class="stat-tile">
        <div class="label">Questions asked</div>
        <div class="value" id="stat-questions">—</div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <h2>Questions per chart</h2>
        <button class="table-toggle" id="chart-table-toggle">View as table</button>
      </div>
      <p class="caption">Based on the last 50 logged events.</p>
      <div id="bar-chart-container"></div>
      <table class="data-table" id="chart-table" style="display:none;">
        <thead><tr><th>Chart</th><th>Questions</th></tr></thead>
        <tbody id="chart-table-body"></tbody>
      </table>
    </div>

    <div class="card">
      <h2>Recent activity</h2>
      <p class="caption">Newest first, up to the last 50 events.</p>
      <div id="activity-container"></div>
    </div>
  </div>

  <div id="tooltip"></div>

  <script>
  (function () {
    const API_BASE = 'http://localhost:8000/api';
    const REFRESH_MS = 15000;

    const CHARTS = [
      { id: 'trend', label: 'Trend' },
      { id: 'forecast', label: 'Forecast' },
      { id: 'monte-carlo', label: 'Monte Carlo' },
      { id: 'volatility', label: 'Volatility' },
      { id: 'correlation', label: 'Correlation' },
    ];

    const statusEl = document.getElementById('status');
    const totalEl = document.getElementById('stat-total');
    const questionsEl = document.getElementById('stat-questions');
    const chartContainer = document.getElementById('bar-chart-container');
    const chartTable = document.getElementById('chart-table');
    const chartTableBody = document.getElementById('chart-table-body');
    const chartTableToggle = document.getElementById('chart-table-toggle');
    const activityContainer = document.getElementById('activity-container');
    const tooltip = document.getElementById('tooltip');
    const refreshBtn = document.getElementById('refresh-btn');

    chartTableToggle.addEventListener('click', () => {
      const showingTable = chartTable.style.display !== 'none';
      chartTable.style.display = showingTable ? 'none' : 'table';
      chartContainer.style.display = showingTable ? 'block' : 'none';
      chartTableToggle.textContent = showingTable ? 'View as table' : 'View as chart';
    });

    function niceMax(value) {
      if (value <= 5) return 5;
      const magnitude = Math.pow(10, Math.floor(Math.log10(value)));
      const residual = value / magnitude;
      let niceResidual;
      if (residual <= 1) niceResidual = 1;
      else if (residual <= 2) niceResidual = 2;
      else if (residual <= 5) niceResidual = 5;
      else niceResidual = 10;
      return niceResidual * magnitude;
    }

    function renderBarChart(counts) {
      const width = 560;
      const height = 240;
      const marginLeft = 36;
      const marginBottom = 30;
      const marginTop = 24;
      const marginRight = 10;
      const plotW = width - marginLeft - marginRight;
      const plotH = height - marginTop - marginBottom;

      const maxCount = Math.max(...counts.map((c) => c.count), 0);
      const axisMax = niceMax(Math.max(maxCount, 1));
      const bandW = plotW / counts.length;
      const barW = Math.min(24, bandW * 0.5);

      const ticks = [0, axisMax / 2, axisMax];

      let svg = `<svg viewBox="0 0 ${width} ${height}" width="100%" role="img" aria-label="Bar chart of questions asked per chart">`;

      ticks.forEach((t) => {
        const y = marginTop + plotH - (t / axisMax) * plotH;
        svg += `<line class="${t === 0 ? 'baseline' : 'gridline'}" x1="${marginLeft}" x2="${width - marginRight}" y1="${y}" y2="${y}" />`;
        svg += `<text x="${marginLeft - 8}" y="${y + 4}" text-anchor="end">${Math.round(t)}</text>`;
      });

      counts.forEach((c, i) => {
        const bandX = marginLeft + i * bandW;
        const barX = bandX + (bandW - barW) / 2;
        const barH = axisMax === 0 ? 0 : (c.count / axisMax) * plotH;
        const barY = marginTop + plotH - barH;

        svg += `<rect class="bar-hit" tabindex="0" role="button"
          aria-label="${c.label}: ${c.count} question${c.count === 1 ? '' : 's'}"
          data-label="${c.label}" data-count="${c.count}"
          x="${barX - 4}" y="${marginTop}" width="${barW + 8}" height="${plotH}" />`;
        svg += `<rect class="bar" x="${barX}" y="${barY}" width="${barW}" height="${Math.max(barH, 1)}" rx="4" />`;
        if (c.count > 0) {
          svg += `<text class="bar-value" x="${barX + barW / 2}" y="${barY - 6}">${c.count}</text>`;
        }
        svg += `<text x="${bandX + bandW / 2}" y="${height - marginBottom + 16}" text-anchor="middle">${c.label}</text>`;
      });

      svg += `</svg>`;
      chartContainer.innerHTML = svg;

      chartContainer.querySelectorAll('.bar-hit').forEach((el) => {
        const show = (evt) => {
          tooltip.innerHTML = `<strong>${el.dataset.count}</strong> question${el.dataset.count === '1' ? '' : 's'} — ${el.dataset.label}`;
          tooltip.style.display = 'block';
          const point = evt.touches ? evt.touches[0] : evt;
          tooltip.style.left = (point ? point.clientX : el.getBoundingClientRect().x) + 'px';
          tooltip.style.top = (point ? point.clientY : el.getBoundingClientRect().y) + 'px';
        };
        el.addEventListener('pointermove', show);
        el.addEventListener('pointerenter', show);
        el.addEventListener('focus', show);
        el.addEventListener('pointerleave', () => { tooltip.style.display = 'none'; });
        el.addEventListener('blur', () => { tooltip.style.display = 'none'; });
      });
    }

    function renderChartTable(counts) {
      chartTableBody.innerHTML = '';
      counts.forEach((c) => {
        const tr = document.createElement('tr');
        const tdLabel = document.createElement('td');
        tdLabel.textContent = c.label;
        const tdCount = document.createElement('td');
        tdCount.textContent = String(c.count);
        tr.appendChild(tdLabel);
        tr.appendChild(tdCount);
        chartTableBody.appendChild(tr);
      });
    }

    function renderActivity(events) {
      if (!events.length) {
        activityContainer.innerHTML = '<p class="empty-state">No activity logged yet — ask a question in the VR app to see it here.</p>';
        return;
      }
      const table = document.createElement('table');
      table.className = 'data-table';
      table.innerHTML = '<thead><tr><th>Time</th><th>Chart</th><th>Question</th><th>Answer</th></tr></thead>';
      const tbody = document.createElement('tbody');

      events.slice().reverse().forEach((e) => {
        const tr = document.createElement('tr');

        const tdTime = document.createElement('td');
        tdTime.textContent = e.timestamp ? new Date(e.timestamp).toLocaleString() : '—';

        const tdChart = document.createElement('td');
        tdChart.textContent = e.chart_id || '—';

        const tdQuestion = document.createElement('td');
        tdQuestion.className = 'truncate';
        tdQuestion.textContent = e.question || '—';
        tdQuestion.title = e.question || '';

        const tdAnswer = document.createElement('td');
        tdAnswer.className = 'truncate';
        tdAnswer.textContent = e.answer || '—';
        tdAnswer.title = e.answer || '';

        tr.appendChild(tdTime);
        tr.appendChild(tdChart);
        tr.appendChild(tdQuestion);
        tr.appendChild(tdAnswer);
        tbody.appendChild(tr);
      });

      table.appendChild(tbody);
      activityContainer.innerHTML = '';
      activityContainer.appendChild(table);
    }

    function fetchAndRender() {
      statusEl.textContent = 'Refreshing...';
      fetch(`${API_BASE}/summary`)
        .then((res) => {
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return res.json();
        })
        .then((data) => {
          totalEl.textContent = data.total_events;
          questionsEl.textContent = data.questions_asked;

          const events = data.events || [];
          const counts = CHARTS.map((c) => ({
            label: c.label,
            count: events.filter((e) => e.type === 'question' && e.chart_id === c.id).length,
          }));

          renderBarChart(counts);
          renderChartTable(counts);
          renderActivity(events);

          statusEl.textContent = `Last updated ${new Date().toLocaleTimeString()}`;
        })
        .catch((err) => {
          statusEl.textContent = `Could not reach the backend (${err.message}) — is uvicorn running?`;
        });
    }

    refreshBtn.addEventListener('click', fetchAndRender);
    fetchAndRender();
    setInterval(fetchAndRender, REFRESH_MS);
  })();
  </script>
</body>
</html>
